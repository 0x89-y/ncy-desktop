[package]
name = "ncy-desktop"
version = "0.8.1"
description = "Desktop client for Ncy"
authors = ["0x89-y"]
edition = "2021"

[lib]
name = "ncy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
chrono = "0.4"
# The UI-agnostic core (event log, sync engine, storage, transcription) lives in
# its own crate, shared with the headless `ncy-server`. Path dep for local dev;
# switch to a pinned git dep for CI/release.
ncy-core = { path = "../../ncy-core" }
ncy-server = { path = "../crates/ncy-server" }

tauri = { version = "2.1.1", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.0.1"
tauri-plugin-dialog = "2.0.1"
tauri-plugin-shell = "2.0.1"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
# Self-update: `updater` fetches + signature-verifies the NSIS installer,
# `process` relaunches into the freshly installed build.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Async runtime (command handlers use tokio::sync + spawn_blocking).
tokio = { version = "1.41", features = ["full"] }

# Serialization — commands.rs builds/parses JSON directly.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Used directly by the command layer.
base64 = "0.22"
uuid = { version = "1.11", features = ["v4", "serde"] }
qrcode = "0.14"
# Sniffing a stored image's real format (we record none) and decoding it to RGBA
# for the clipboard, which takes raw pixels rather than JPEG. Only the formats a
# phone or desktop can plausibly send.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
] }
zip = "2"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
